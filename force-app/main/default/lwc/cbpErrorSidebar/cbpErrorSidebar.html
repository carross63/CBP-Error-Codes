<template>
    <aside class="sidebar" aria-label="Error code filters">
        <div class="sidebar-title-row">
            <h2 class="sidebar-title">Filters</h2>
            <template lwc:if={hasActiveFilters}>
                <button type="button" class="clear-filters-btn" onclick={handleReset}>Clear filters</button>
            </template>
        </div>

        <h3>Search</h3>
        <input
            type="search"
            class="search-input"
            placeholder="Code or keyword, e.g. 439, quantity..."
            value={searchTerm}
            oninput={handleSearchInput}
        />
        <p class="total-count">{resultsSummary}</p>

        <div class="filter-group">
            <h3>Category</h3>
            <button type="button" class={allCategoriesClass} data-value="" onclick={handleCategoryClick}>
                <span>All categories</span>
            </button>
            <template for:each={categoryOptions} for:item="cat">
                <button
                    type="button"
                    key={cat.value}
                    class={cat.cssClass}
                    data-value={cat.value}
                    onclick={handleCategoryClick}
                >
                    <span>{cat.label}</span>
                    <span class="filter-count">{cat.count}</span>
                </button>
            </template>
        </div>
    </aside>
</template>
