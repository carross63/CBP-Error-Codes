<template>
    <div class="table-card">
        <template lwc:if={hasResults}>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="col-code" scope="col">
                                <button type="button" class={codeHeaderClass} data-field="code" onclick={handleSort}>
                                    Code
                                    <svg class="sort-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 4V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3.5 8L7 4.2L10.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M17 20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M20.5 16L17 19.8L13.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </th>
                            <th class="col-narr" scope="col">Narrative</th>
                            <th class="col-cat" scope="col">
                                <button type="button" class={categoryHeaderClass} data-field="category" onclick={handleSort}>
                                    Category
                                    <svg class="sort-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 4V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3.5 8L7 4.2L10.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M17 20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M20.5 16L17 19.8L13.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </th>
                            <th class="col-flow" scope="col">
                                <button type="button" class={flowHeaderClass} data-field="flow" onclick={handleSort}>
                                    Flow
                                    <svg class="sort-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 4V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3.5 8L7 4.2L10.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M17 20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M20.5 16L17 19.8L13.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </th>
                            <th class="col-date" scope="col">
                                <button type="button" class={dateHeaderClass} data-field="dateUpdated" onclick={handleSort}>
                                    Updated
                                    <svg class="sort-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M7 4V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M3.5 8L7 4.2L10.5 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M17 20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M20.5 16L17 19.8L13.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </th>
                            <th class="col-action" scope="col">
                                <span class="sr-only">Details</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={pageRows} for:item="row">
                            <tr key={row.id} class={row.rowClass}>
                                <td class="col-code">
                                    <span class="code-pill">{row.code}</span>
                                </td>
                                <td class="col-narr">
                                    <span class="narrative">{row.narrative}</span>
                                </td>
                                <td class="col-cat">
                                    <span class="tag">{row.category}</span>
                                </td>
                                <td class="col-flow">
                                    <span class="tag">{row.flow}</span>
                                </td>
                                <td class="col-date updated">{row.displayDate}</td>
                                <td class="col-action">
                                    <button
                                        type="button"
                                        class="view-details"
                                        data-id={row.id}
                                        onclick={handleRowToggle}
                                        aria-expanded={row.isExpanded}
                                    >
                                        {row.toggleLabel}
                                    </button>
                                </td>
                            </tr>
                            <template lwc:if={row.isExpanded}>
                                <tr key={row.detailKey} class="error-detail-row">
                                    <td colspan="6">
                                        <div class="error-detail">
                                            <h3 class="error-detail__title">
                                                Condition code {row.code} &mdash; {row.narrative}
                                            </h3>
                                            <p class="error-detail__explanation">{row.explanation}</p>
                                            <dl class="error-detail__meta">
                                                <div>
                                                    <dt>Category</dt>
                                                    <dd>{row.category}</dd>
                                                </div>
                                                <div>
                                                    <dt>Transaction flow</dt>
                                                    <dd>{row.flow}</dd>
                                                </div>
                                                <div>
                                                    <dt>Last updated</dt>
                                                    <dd>{row.displayDate}</dd>
                                                </div>
                                            </dl>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="table-footer">
                <div class="rows-per-page">
                    <label for="rowsPerPage">Rows per page</label>
                    <select id="rowsPerPage" onchange={handlePageSizeChange}>
                        <template for:each={pageSizeOptions} for:item="opt">
                            <option key={opt.value} value={opt.value} selected={opt.isSelected}>{opt.label}</option>
                        </template>
                    </select>
                </div>

                <div class="footer-summary">{resultsSummary}</div>

                <div class="pagination">
                    <button type="button" class="page-btn" disabled={isFirstPage} onclick={handlePrev} aria-label="Previous page">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M10.5 5.5L4 12L10.5 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="page-numbers">
                        <template for:each={pageNumbers} for:item="pg">
                            <button
                                lwc:if={pg.isPage}
                                key={pg.key}
                                type="button"
                                class={pg.cssClass}
                                data-page={pg.value}
                                onclick={handlePageClick}
                            >{pg.value}</button>
                            <span lwc:else key={pg.key} class="page-ellipsis">&hellip;</span>
                        </template>
                    </div>
                    <button type="button" class="page-btn" disabled={isLastPage} onclick={handleNext} aria-label="Next page">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M13.5 5.5L20 12L13.5 18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="table-empty">
                No error codes match your current filters. Try clearing a filter or adjusting your search.
            </div>
        </template>
    </div>
</template>
